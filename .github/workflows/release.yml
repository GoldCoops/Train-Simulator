name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # fetch-depth: 0 fetches every branch, so origin/master is present.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A tag push can't be filtered by branch, and github.event.base_ref is
      # only set for lightweight tags, so check ancestry directly.
      - name: Check tag is on master
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master \
            || { echo "::error::Tag $GITHUB_REF_NAME is not on master; not releasing."; exit 1; }

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6 # validates the wrapper by default

      - run: ./gradlew test jar -PreleaseVersion="${GITHUB_REF_NAME#v}"

      - run: gh release create "$GITHUB_REF_NAME" build/libs/*.jar --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
